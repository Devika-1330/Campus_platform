{% extends "base.html" %}
{% block title %}Report found item — Campus Platform{% endblock %}
{% block content %}
<h1 class="page-title">Report found item</h1>
<div class="card" style="max-width: 520px;">
  <form method="post" action="{{ url_for('report_found') }}">
    <div class="form-group">
      <label for="item_name">Item name *</label>
      <input type="text" id="item_name" name="item_name" required placeholder="e.g. ID card, Keys, Bag" />
    </div>
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" placeholder="Color, condition, where kept"></textarea>
    </div>
    <div class="form-group">
      <label for="location">Where found</label>
      <input type="text" id="location" name="location" placeholder="e.g. Canteen, Lab" />
    </div>
    <div class="form-group">
      <label for="date_found">Date found</label>
      <input type="date" id="date_found" name="date_found" />
    </div>
    <div class="form-group">
      <label for="contact">Contact (for owners)</label>
      <input type="text" id="contact" name="contact" placeholder="Phone or email" />
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Submit</button>
      <a href="{{ url_for('lost_found') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
