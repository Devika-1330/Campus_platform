{% extends "base.html" %}
{% block title %}Raise complaint — Campus Platform{% endblock %}
{% block content %}
<h1 class="page-title">Raise complaint</h1>
<div class="card" style="max-width: 560px;">
  <form method="post" action="{{ url_for('raise_complaint') }}">
    <div class="form-group">
      <label for="category">Category *</label>
      <select id="category" name="category" required>
        <option value="">Select category</option>
        {% for cat in categories %}
        <option value="{{ cat }}">{{ cat }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="title">Title *</label>
      <input type="text" id="title" name="title" required placeholder="Short title for the issue" />
    </div>
    <div class="form-group">
      <label for="description">Description *</label>
      <textarea id="description" name="description" required placeholder="Describe the issue in detail"></textarea>
    </div>
    <div class="form-group">
      <label for="location">Location (optional)</label>
      <input type="text" id="location" name="location" placeholder="e.g. Hostel Block B, Canteen" />
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Submit complaint</button>
      <a href="{{ url_for('complaints_list') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
